name: iOS unsigned ipa

# 在云端 macOS 上把 Windows 导出的 Xcode 工程编成「未签名 ipa」，
# 供 Windows + Sideloadly 用免费 Apple ID 重签装到 iPhone。
# 不需要任何证书/密钥；公开仓库的 macOS runner 分钟数免费、不限次数。

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "Xcode 工程压缩包 URL（tar.gz）"
        required: false
        default: "https://crossgate-assets.oss-cn-shanghai.aliyuncs.com/ios-xcode/Unity-iPhone.tar.gz"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: 环境自检
        run: |
          xcodebuild -version
          ls -d /Applications/Xcode*.app || true
          sw_vers
          df -h /

      - name: 下载 Xcode 工程
        run: |
          set -e
          URL="${{ github.event.inputs.project_url }}"
          mkdir -p "$RUNNER_TEMP/proj"
          curl -fSL --retry 3 -o "$RUNNER_TEMP/proj.tar.gz" "$URL"
          ls -lh "$RUNNER_TEMP/proj.tar.gz"
          tar -xzf "$RUNNER_TEMP/proj.tar.gz" -C "$RUNNER_TEMP/proj"
          ls "$RUNNER_TEMP/proj"
          test -d "$RUNNER_TEMP/proj/Unity-iPhone/Unity-iPhone.xcodeproj"

      - name: 编译（关闭签名）
        run: |
          set -e
          cd "$RUNNER_TEMP/proj/Unity-iPhone"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -target Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -jobs 4 \
            CONFIGURATION_BUILD_DIR="$OUT" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -40

          APP="$(find "$OUT" -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP" || { echo "没有产出 .app"; ls -la "$OUT"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          du -sh "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Frameworks/UnityFramework.framework/UnityFramework"
          test -d "$APP/Data/Managed"

      - name: 打包未签名 ipa
        run: |
          set -e
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          APPNAME="$(basename "$APP")"
          rm -rf "Payload/$APPNAME/_CodeSignature" || true
          rm -f  "Payload/$APPNAME/embedded.mobileprovision" || true
          /usr/bin/zip -qry Unity-iPhone-unsigned.ipa Payload
          ls -lh Unity-iPhone-unsigned.ipa
          shasum -a 256 Unity-iPhone-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            ${{ runner.temp }}/Unity-iPhone-unsigned.ipa
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 14
